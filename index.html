<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다운고 음료 주문 대시보드</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; background: #f0f2f5; color: #111; }

  .header { background: #1a7a4a; color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 18px; font-weight: 700; }
  .badge { font-size: 11px; padding: 3px 10px; border-radius: 99px; font-weight: 700; }
  .badge-live { background: #00e676; color: #003d1a; }
  .badge-off  { background: rgba(255,255,255,0.2); color: #fff; }

  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 14px 16px; background: #fff; border-bottom: 1px solid #f0f0f0; }
  .stat { background: #f0faf4; border-radius: 10px; padding: 10px 12px; text-align: center; }
  .stat .lbl { font-size: 11px; color: #555; margin-bottom: 4px; }
  .stat .val { font-size: 22px; font-weight: 700; color: #1a7a4a; }
  .stat .sub { font-size: 11px; color: #888; margin-top: 2px; }

  .toolbar { display: flex; gap: 8px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #f0f0f0; flex-wrap: wrap; align-items: center; }
  .toolbar select, .toolbar button { font-size: 13px; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid #ddd; background: #fff; color: #333; cursor: pointer; font-family: inherit; }
  .toolbar button:hover { background: #f0faf4; border-color: #1a7a4a; color: #1a7a4a; }
  .btn-sound { background: #e8f5e9 !important; border-color: #1a7a4a !important; color: #1a7a4a !important; font-weight: 700; }
  .btn-sound.off { background: #f5f5f5 !important; border-color: #ccc !important; color: #888 !important; }
  .btn-done-all { background: #1a7a4a !important; color: #fff !important; border-color: #1a7a4a !important; font-weight: 700; }
  .btn-clear { background: #fff0f0 !important; border-color: #e53935 !important; color: #e53935 !important; font-weight: 700; }

  .drink-bar { padding: 8px 16px; background: #fff; border-bottom: 1px solid #f0f0f0; display: flex; gap: 6px; flex-wrap: wrap; min-height: 42px; align-items: center; }
  .chip { font-size: 12px; padding: 4px 12px; border-radius: 99px; border: 1px solid #c8e6c9; background: #f0faf4; display: flex; align-items: center; gap: 5px; }
  .chip .cnt { font-weight: 700; color: #1a7a4a; }
  .chip-none { font-size: 12px; color: #aaa; }

  .section-title { padding: 10px 16px 6px; font-size: 12px; font-weight: 700; color: #888; letter-spacing: 0.5px; }

  .order-list { padding: 0 12px 80px; }
  .order-card { background: #fff; border: 1px solid #eee; border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; transition: opacity 0.2s; }
  .order-card.done { background: #fafafa; }
  .order-card.done .order-name { text-decoration: line-through; text-decoration-thickness: 2px; color: #aaa; }
  .order-card.done .order-meta { text-decoration: line-through; color: #ccc; }
  .order-card.done .drink-icons { opacity: 0.35; }
  .order-card.done .order-price { text-decoration: line-through; color: #bbb; }
  .order-card.new-pulse { border-color: #1a7a4a; background: #f0faf4; animation: pulse 0.6s ease; }
  @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.01)} 100%{transform:scale(1)} }

  .order-top-row { display: flex; align-items: center; gap: 12px; }
  .order-num { font-size: 12px; font-weight: 700; color: #aaa; min-width: 28px; text-align: center; flex-shrink: 0; }
  .order-time { font-size: 11px; color: #888; min-width: 46px; text-align: center; flex-shrink: 0; }
  .order-info { flex: 1; min-width: 0; }
  .order-name { font-size: 15px; font-weight: 700; }
  .order-meta { font-size: 12px; color: #888; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .order-price { font-size: 13px; font-weight: 700; color: #1a7a4a; margin-top: 2px; }
  .check-btn { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid #ccc; background: #fff; cursor: pointer; font-size: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; position: relative; z-index: 5; }
  .check-btn:hover { background: #e8f5e9; border-color: #1a7a4a; }
  .check-btn.checked { background: #1a7a4a; border-color: #1a7a4a; color: #fff; }

  /* 음료 이미지 (접수시간 옆에 인라인으로 배치, 많으면 가로 스크롤) */
  .drink-icons { display: flex; gap: 6px; flex-wrap: nowrap; flex-shrink: 0; max-width: 150px; overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
  .drink-icons::-webkit-scrollbar { height: 3px; }
  .drink-icons::-webkit-scrollbar-thumb { background: #c8e6c9; border-radius: 4px; }
  .drink-icon-box { display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; }
  .drink-icon-img { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; background: #f0faf4; border: 1px solid #e0f0e6; }
  .drink-icon-emoji { width: 44px; height: 44px; border-radius: 12px; background: #f0faf4; border: 1px solid #e0f0e6; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  /* 사이즈 배지: M은 작고 차분하게, L은 크고 눈에 띄게 */
  .size-badge { font-weight: 800; border-radius: 99px; line-height: 1.3; flex-shrink: 0; }
  .size-m { font-size: 10px; color: #37474f; background: #e3e8eb; padding: 1px 7px; }
  .size-l { font-size: 13px; color: #fff; background: #e65100; padding: 1px 9px; box-shadow: 0 0 0 2px #ffe0b2; }
  .drink-qty-badge { font-size: 9px; color: #555; font-weight: 600; }

  /* 음료별 한 줄: 사이즈 · 이름 · 수량 · 옵션 칩 */
  .item-lines { margin-top: 4px; display: flex; flex-direction: column; gap: 4px; }
  .item-line { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: 13px; }
  .item-name { font-weight: 600; color: #333; }
  .item-qty { font-weight: 800; color: #c62828; }
  .opt-chip { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: #f3f3f3; color: #555; border: 1px solid #e6e6e6; white-space: nowrap; }
  .opt-chip.hl { background: #fff8e1; color: #6d4c00; border-color: #ffcc80; font-weight: 700; }
  .order-card.done .item-lines { opacity: 0.45; text-decoration: line-through; }

  /* 배달시간 임박(15분 이내) / 지남 */
  .order-card.urgent { border: 2px solid #e53935; background: #fff5f5; }
  .order-card.late { border: 2px solid #b71c1c; background: #ffebee; }
  .due-tag { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 6px; margin-left: 4px; color: #fff; background: #e53935; }
  .order-card.late .due-tag { background: #b71c1c; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: 0.45; } }

  /* Hot / Ice 배지 */
  .temp-badge { font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 6px; flex-shrink: 0; }
  .temp-hot { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
  .temp-ice { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }

  /* 큰 글씨 모드 (카운터에서 멀리 볼 때) */
  .btn-big.on { background: #1a7a4a !important; color: #fff !important; border-color: #1a7a4a !important; font-weight: 700; }
  body.big .order-name { font-size: 22px; }
  body.big .order-meta { font-size: 15px; }
  body.big .order-price { font-size: 16px; }
  body.big .order-time { font-size: 14px; min-width: 60px; }
  body.big .order-num { font-size: 15px; }
  body.big .item-line { font-size: 18px; gap: 6px; }
  body.big .opt-chip { font-size: 15px; padding: 2px 9px; }
  body.big .size-m { font-size: 13px; }
  body.big .size-l { font-size: 17px; }
  body.big .temp-badge { font-size: 13px; }
  body.big .due-tag, body.big .delivery-tag { font-size: 14px; }
  body.big .drink-icons { max-width: 220px; }
  body.big .drink-icon-img, body.big .drink-icon-emoji { width: 64px; height: 64px; font-size: 34px; }
  body.big .check-btn { width: 52px; height: 52px; font-size: 24px; }
  body.big .time-group-header { font-size: 16px; }

  .empty { text-align: center; padding: 48px 16px; color: #aaa; font-size: 14px; line-height: 2; }

  .delivery-tag { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 6px; background: #e3f2fd; color: #1565c0; font-weight: 600; margin-right: 4px; }

  /* 배달 시간대 그룹 헤더 */
  .time-group-header { padding: 8px 12px; margin: 8px 12px 4px; background: #f8f8f8; border-radius: 8px; font-size: 12px; font-weight: 700; color: #555; display: flex; align-items: center; gap: 6px; }
  .time-group-header .tg-time { color: #1a7a4a; }
  .time-group-header .tg-cnt { background: #1a7a4a; color: #fff; border-radius: 99px; padding: 1px 8px; font-size: 11px; }
  .time-group-header .tg-pending { background: #ff9800; color: #fff; border-radius: 99px; padding: 1px 8px; font-size: 11px; }

  /* 날짜 탭 */
  .date-tab { display: flex; padding: 8px 16px; background: #fff; border-bottom: 1px solid #f0f0f0; gap: 6px; overflow-x: auto; }
  .date-btn { flex-shrink: 0; white-space: nowrap; font-size: 12px; padding: 5px 14px; border-radius: 99px; border: 1px solid #ddd; background: #fff; color: #666; cursor: pointer; font-family: inherit; font-weight: 600; }
  .date-btn.active { background: #1a7a4a; color: #fff; border-color: #1a7a4a; }
</style>
</head>
<body>

<div class="header">
  <h1>🥤 다운고 음료 주문 대시보드</h1>
  <div style="display:flex;gap:8px;align-items:center;">
    <span id="date-label" class="badge badge-off"></span>
    <span id="conn-badge" class="badge badge-off">연결 중...</span>
  </div>
</div>

<div class="summary">
  <div class="stat"><div class="lbl">전체</div><div class="val" id="s-total">0</div><div class="sub">건</div></div>
  <div class="stat"><div class="lbl">대기</div><div class="val" id="s-pending" style="color:#e65100;">0</div><div class="sub">건</div></div>
  <div class="stat"><div class="lbl">완료</div><div class="val" id="s-done">0</div><div class="sub">건</div></div>
  <div class="stat"><div class="lbl">음료종류</div><div class="val" id="s-types">0</div><div class="sub">가지</div></div>
</div>

<div class="drink-bar" id="drink-bar">
  <span class="chip-none">주문 없음</span>
</div>

<div class="toolbar">
  <select id="filter-sel" onchange="applyFilter()">
    <option value="all">전체 보기</option>
    <option value="pending">대기 중만</option>
    <option value="done">완료만</option>
  </select>
  <select id="group-sel" onchange="renderOrders()">
    <option value="time">배달시간 순</option>
    <option value="order">접수시간 순</option>
  </select>
  <button class="btn-sound" id="sound-btn" onclick="toggleSound()">🔔 소리 켜짐</button>
  <button class="btn-big" id="big-btn" onclick="toggleBig()">🔍 큰 글씨</button>
  <button class="btn-done-all" onclick="markAllDone()">✅ 전체 완료</button>
</div>

<div class="date-tab" id="date-tab"></div>

<div id="section-title" class="section-title">주문 목록</div>
<div class="order-list" id="order-list">
  <div class="empty">🔄 Firebase 연결 중...</div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ─── Firebase 설정 ────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyCEKr4-mG3_GsDR-hXRSM62j8dwGazmD6U",
  authDomain: "daun-drinks-cd57f.firebaseapp.com",
  projectId: "daun-drinks-cd57f",
  storageBucket: "daun-drinks-cd57f.firebasestorage.app",
  messagingSenderId: "654475550073",
  appId: "1:654475550073:web:b04955e6eeeb2b5abb23a8"
};

// ─── 상태 ────────────────────────────────────────────────────
let allOrders = [];
let db = null;
let drinkIconMap = {}; // 음료 이름 -> 이미지/이모지 매핑 (config/drinks에서 로드)
let drinkConfigMap = {}; // 음료 이름 -> 메뉴 설정 전체 (옵션 그룹 이름을 찾는 데 사용)
// 완료 상태는 각 주문 객체의 status 필드(Firestore에 영구 저장)로 관리합니다
let soundEnabled = true;
let filterMode = 'all';
let prevOrderIds = new Set();
let audioCtx = null;
let selectedDate = getTodayStr();

// ─── 날짜 유틸 ───────────────────────────────────────────────
function getTodayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtPrice(n) { return (n||0).toLocaleString('ko-KR') + '원'; }
function fmtTime(isoStr) {
  if (!isoStr) return '--:--';
  const d = new Date(isoStr);
  return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}

// 음료 이름으로 등록된 아이콘(이모지 또는 이미지)을 가져와 HTML로 반환 (큰 박스 형태)
function getDrinkIconHtml(name) {
  const src = drinkIconMap[name];
  if (!src) return '<div class="drink-icon-emoji">🥤</div>'; // 매칭 안 되면 기본값
  if (src.startsWith('emoji:')) {
    return `<div class="drink-icon-emoji">${src.replace('emoji:','')}</div>`;
  }
  return `<img class="drink-icon-img" src="${src}" alt="" onerror="this.outerHTML='<div class=&quot;drink-icon-emoji&quot;>🥤</div>'">`;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// "아메리카노(Ice)" → { base: "아메리카노", temp: "ice" }
function splitTemp(name) {
  const m = String(name || '').match(/^(.*?)\s*\((hot|ice)\)\s*$/i);
  return m ? { base: m[1], temp: m[2].toLowerCase() } : { base: String(name || ''), temp: '' };
}
function tempBadge(temp) {
  if (temp === 'hot') return '<span class="temp-badge temp-hot">🔥 HOT</span>';
  if (temp === 'ice') return '<span class="temp-badge temp-ice">🧊 ICE</span>';
  return '';
}

// 오늘 대기 중인 주문의 배달시간까지 남은 분 (해당 없으면 null)
const DUE_SOON_MIN = 15;
function minutesUntilDelivery(o) {
  if (o.status === '완료' || getOrderDate(o) !== getTodayStr()) return null;
  const m = String(o.deliveryTime || '').match(/(\d{1,2}):(\d{2})/);
  if (!m) return null;
  const now = new Date();
  return (parseInt(m[1], 10) * 60 + parseInt(m[2], 10)) - (now.getHours() * 60 + now.getMinutes());
}

function sizeBadge(size) {
  const s = String(size || 'M').toUpperCase();
  return `<span class="size-badge ${s === 'L' ? 'size-l' : 'size-m'}">${esc(s)}</span>`;
}

// ─── 옵션 이모지 ─────────────────────────────────────────────
// 주문에는 옵션 값("보통", "1t" 등)만 저장되고 옵션 이름("꿀", "시럽")은 없습니다.
// 주문앱은 메뉴 설정의 옵션 순서대로 값을 저장하므로, 같은 순번의 옵션 그룹에서 이름을 찾고
// 메뉴가 바뀌어 순번이 안 맞으면 그 값을 선택지로 가진 그룹을 찾습니다.
const HIDDEN_CHOICES = ['추가 안함'];

function findOptionGroup(drinkName, value, idx) {
  const groups = (drinkConfigMap[drinkName] || {}).options || [];
  const g = groups[idx];
  if (g && (g.choices || []).includes(value)) return g;
  return groups.find(x => (x.choices || []).includes(value)) || null;
}

function optionEmoji(label, value) {
  const s = label + ' ' + value;
  if (/샷/.test(s)) {
    const n = parseInt(value, 10) || 1;
    return '☕'.repeat(Math.min(Math.max(n, 1), 3));
  }
  if (/꿀/.test(s)) return '🍯';
  if (/시럽/.test(s)) return '🍬';
  if (/딸기/.test(s)) return '🍓';
  if (/두유/.test(value)) return '🫘';
  if (/우유/.test(value)) return '🥛';
  if (/^물$/.test(value)) return '💧';
  if (/no ice/i.test(value)) return '🚫🧊';
  if (/얼음|ice/i.test(s)) return '🧊';
  if (/달게|당도/.test(s)) return '🍃';
  return '➕';
}

function buildOptChip(drinkName, value, idx) {
  if (!value || HIDDEN_CHOICES.includes(value)) return '';
  const g = findOptionGroup(drinkName, value, idx);
  const label = g ? String(g.label || '').trim() : '';
  const text = value.replace(/^[^\p{L}\p{N}]+/u, '').trim(); // "🧊 With Ice" → "With Ice"
  // 샷·베이스·얼음은 값만으로 뜻이 통하고, 시럽·꿀 같은 추가 옵션은 이름을 붙입니다
  const short = label.replace(/추가|수제/g, '').trim();
  const showLabel = short && !/샷|베이스|얼음/.test(label) && !text.includes(short);
  const isNonDefault = g && g.default && g.default !== value;
  return `<span class="opt-chip${isNonDefault ? ' hl' : ''}">${optionEmoji(label, value)} ${esc(showLabel ? short + ' ' + text : text)}</span>`;
}

// config/drinks에서 음료별 아이콘 정보를 불러와 매핑 구성
function loadDrinkIcons() {
  if (!db) return;
  db.collection('config').doc('drinks').get().then(snap => {
    if (snap.exists) {
      const list = snap.data().list || [];
      list.forEach(d => {
        if (!d.name) return;
        drinkIconMap[d.name] = d.image || '';
        drinkConfigMap[d.name] = d;
      });
      renderOrders(); // 아이콘 매핑 적용해서 다시 그리기
    }
  }).catch(err => console.error('음료 아이콘 로드 실패:', err));
}

// ─── 헤더 날짜 ───────────────────────────────────────────────
document.getElementById('date-label').textContent = getTodayStr();

// ─── 소리 ────────────────────────────────────────────────────
function playNewOrderSound() {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, i) => {
      const osc  = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sine'; osc.frequency.value = freq;
      const t = audioCtx.currentTime + i * 0.18;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.3, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      osc.start(t); osc.stop(t + 0.5);
    });
  } catch(e) {}
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('sound-btn');
  btn.textContent = soundEnabled ? '🔔 소리 켜짐' : '🔕 소리 꺼짐';
  btn.className = soundEnabled ? 'btn-sound' : 'btn-sound off';
}

// ─── 큰 글씨 모드 (이 기기에 기억) ───────────────────────────
function setBig(on) {
  document.body.classList.toggle('big', on);
  const btn = document.getElementById('big-btn');
  btn.classList.toggle('on', on);
  btn.textContent = on ? '🔍 큰 글씨 켜짐' : '🔍 큰 글씨';
  try { localStorage.setItem('bigText', on ? '1' : '0'); } catch (e) {}
}
function toggleBig() { setBig(!document.body.classList.contains('big')); }
try { if (localStorage.getItem('bigText') === '1') setBig(true); } catch (e) {}

// 배달 임박 표시가 시간에 맞춰 바뀌도록 30초마다 다시 그립니다
setInterval(() => { if (allOrders.length) renderOrders(); }, 30000);

// ─── 필터/버튼 ───────────────────────────────────────────────
function applyFilter() {
  filterMode = document.getElementById('filter-sel').value;
  renderOrders();
}
function markAllDone() {
  const targets = getFilteredByDate().filter(o => o.status !== '완료');
  targets.forEach(o => { o.status = '완료'; }); // 화면 즉시 반영
  renderOrders();
  const batch = db.batch();
  targets.forEach(o => batch.update(db.collection('orders').doc(o.id), { status: '완료' }));
  batch.commit().catch(err => console.error('일괄 완료 처리 실패:', err));
}
function toggleCheck(id) {
  const order = allOrders.find(o => String(o.id) === String(id));
  if (!order) { console.error('주문을 찾을 수 없음:', id); return; }
  const newStatus = order.status === '완료' ? '주문완료' : '완료';
  order.status = newStatus; // 화면 즉시 반영
  renderOrders();
  db.collection('orders').doc(String(id)).update({ status: newStatus })
    .catch(err => console.error('상태 저장 실패:', err));
}

// 체크 버튼은 각 버튼의 인라인 onclick으로 처리합니다 (이벤트 위임과 중복되지 않도록 단일화)

// ─── 날짜 필터 ───────────────────────────────────────────────
// 주문의 날짜(YYYY-MM-DD)를 한국 시간 기준으로 돌려줍니다.
// 주문앱이 저장하는 deliveryDate / orderTime 은 UTC 기준이라, 한국 시간 오전 9시 이전에
// 주문하면 하루 전 날짜로 저장됩니다. 반면 deliveryLabel("오늘 11월 11일 (수)")은
// 기기의 현지 날짜로 만들어지므로 이 값을 우선 사용합니다.
function pad2(n) { return String(n).padStart(2, '0'); }
function localDateStr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

function getOrderDate(o) {
  const m = (o.deliveryLabel || '').match(/(\d{1,2})월\s*(\d{1,2})일/);
  if (m) {
    const mon = parseInt(m[1], 10);
    const day = parseInt(m[2], 10);
    const base = o.orderTime ? new Date(o.orderTime) : new Date();
    let year = base.getFullYear();
    const baseMon = base.getMonth() + 1;
    // 연말/연초에 주문한 경우 연도 보정 (12월 주문 → 1월 배달 등)
    if (mon < baseMon - 6) year += 1;
    else if (mon > baseMon + 6) year -= 1;
    return year + '-' + pad2(mon) + '-' + pad2(day);
  }
  if (o.deliveryDate) return o.deliveryDate;
  if (o.orderTime) return localDateStr(new Date(o.orderTime));
  return getTodayStr();
}

function getFilteredByDate() {
  return allOrders.filter(o => getOrderDate(o) === selectedDate);
}

function buildDateTabs() {
  const dates = new Set(allOrders.map(o => getOrderDate(o)));
  const sorted = [...dates].sort().reverse();
  const tab = document.getElementById('date-tab');
  if (sorted.length === 0) { tab.innerHTML = ''; return; }

  // 오늘 없으면 추가
  if (!dates.has(getTodayStr())) sorted.unshift(getTodayStr());

  tab.innerHTML = sorted.map(d => {
    const label = d === getTodayStr() ? `오늘 (${d})` : d;
    const cnt = allOrders.filter(o => getOrderDate(o) === d).length;
    return `<button class="date-btn ${d===selectedDate?'active':''}" onclick="selectDate('${d}')">${label} ${cnt>0?`<b style='color:${d===selectedDate?'#fff':'#1a7a4a'}'>·${cnt}</b>`:''}</button>`;
  }).join('');
}

function selectDate(d) {
  selectedDate = d;
  buildDateTabs();
  renderOrders();
}

// ─── 렌더링 ──────────────────────────────────────────────────
function renderOrders() {
  let orders = getFilteredByDate();

  // 요약
  const total = orders.length;
  const done  = orders.filter(o => o.status === '완료').length;
  const pending = total - done;
  const drinkMap = {};
  orders.forEach(o => {
    (o.items || []).forEach(item => {
      const k = item.name || '?';
      drinkMap[k] = (drinkMap[k] || 0) + (item.qty || 1);
    });
  });
  document.getElementById('s-total').textContent   = total;
  document.getElementById('s-pending').textContent = pending;
  document.getElementById('s-done').textContent    = done;
  document.getElementById('s-types').textContent   = Object.keys(drinkMap).length;

  // 음료 칩
  const bar = document.getElementById('drink-bar');
  if (Object.keys(drinkMap).length === 0) {
    bar.innerHTML = '<span class="chip-none">주문 없음</span>';
  } else {
    bar.innerHTML = Object.entries(drinkMap)
      .sort((a,b) => b[1]-a[1])
      .map(([name,cnt]) => {
        const src = drinkIconMap[name];
        let mini;
        if (!src) mini = '<span style="font-size:16px;">🥤</span>';
        else if (src.startsWith('emoji:')) mini = `<span style="font-size:16px;">${src.replace('emoji:','')}</span>`;
        else mini = `<img src="${src}" alt="" style="width:18px;height:18px;border-radius:50%;object-fit:cover;" onerror="this.style.display='none'">`;
        const { base, temp } = splitTemp(name);
        return `<div class="chip">${mini}${tempBadge(temp)}<span>${esc(base)}</span><span class="cnt">${cnt}잔</span></div>`;
      })
      .join('');
  }

  // 필터 적용
  let filtered = orders.filter(o => {
    const isDone = o.status === '완료';
    if (filterMode === 'pending') return !isDone;
    if (filterMode === 'done')    return isDone;
    return true;
  });

  const groupMode = document.getElementById('group-sel').value;
  const list = document.getElementById('order-list');
  document.getElementById('section-title').textContent = `주문 목록 (${filtered.length}건)`;

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty">📋<br>${filterMode==='pending'?'대기 중인 주문 없음':filterMode==='done'?'완료된 주문 없음':'주문 없음'}</div>`;
    return;
  }

  if (groupMode === 'time') {
    // 배달시간 순 그룹핑
    filtered.sort((a,b) => (a.deliveryTime||'99:99').localeCompare(b.deliveryTime||'99:99'));
    const groups = {};
    filtered.forEach(o => {
      const key = o.deliveryTime || '미정';
      if (!groups[key]) groups[key] = [];
      groups[key].push(o);
    });
    let html = '';
    Object.entries(groups).forEach(([time, grpOrders]) => {
      const pendingCnt = grpOrders.filter(o => o.status !== '완료').length;
      html += `<div class="time-group-header">
        <span class="tg-time">📅 ${time}</span>
        <span class="tg-cnt">${grpOrders.length}건</span>
        ${pendingCnt > 0 ? `<span class="tg-pending">대기 ${pendingCnt}</span>` : '<span style="font-size:11px;color:#1a7a4a;">✅ 완료</span>'}
      </div>`;
      grpOrders.forEach((o, i) => { html += buildOrderCard(o, i+1); });
    });
    list.innerHTML = html;
  } else {
    // 접수시간 순
    filtered.sort((a,b) => new Date(a.orderTime||0) - new Date(b.orderTime||0));
    list.innerHTML = filtered.map((o,i) => buildOrderCard(o, i+1)).join('');
  }
}

function buildOrderCard(o, num) {
  const isDone = o.status === '완료';
  const items = o.items || [];
  // 각 음료를 개별 이미지+사이즈+수량으로 표시
  const drinkIconsHtml = items.map(i => {
    const iconHtml = getDrinkIconHtml(i.name);
    const qty = i.qty || 1;
    return `<div class="drink-icon-box">
      ${iconHtml}
      ${sizeBadge(i.size)}
      ${qty > 1 ? `<span class="drink-qty-badge">×${qty}</span>` : ''}
    </div>`;
  }).join('');
  const itemsSummary = items.map(i => {
    const optStr = (i.options && i.options.length) ? ` [${i.options.join('/')}]` : '';
    return `${i.name}(${i.size||'M'})×${i.qty||1}${optStr}`;
  }).join(', ');
  // 음료마다 한 줄: 사이즈 · 이름 · 수량 · 옵션(이모지)
  const itemLinesHtml = items.map(i => {
    const qty = i.qty || 1;
    const opts = (i.options || []).map((v, idx) => buildOptChip(i.name, v, idx)).join('');
    const { base, temp } = splitTemp(i.name || '?');
    return `<div class="item-line">${sizeBadge(i.size)}${tempBadge(temp)}<span class="item-name">${esc(base)}</span>${qty > 1 ? `<span class="item-qty">×${qty}</span>` : ''}${opts}</div>`;
  }).join('');
  const meta = [o.location, itemsSummary].filter(Boolean).join(' · ');
  const orderTimeStr = fmtTime(o.orderTime);
  const delivLabel = o.deliveryLabel || o.deliveryDate || '';
  const strike = isDone ? 'text-decoration:line-through;text-decoration-thickness:2px;color:#aaa;' : '';
  const cardBg = isDone ? 'background:#f0f0f0;' : '';
  const mins = minutesUntilDelivery(o);
  let dueClass = '', dueTag = '';
  if (mins !== null && mins < 0) { dueClass = ' late'; dueTag = `<span class="due-tag">⚠️ ${-mins}분 지남</span>`; }
  else if (mins !== null && mins <= DUE_SOON_MIN) { dueClass = ' urgent'; dueTag = `<span class="due-tag">⏰ ${mins === 0 ? '지금' : mins + '분 남음'}</span>`; }

  return `<div class="order-card${isDone?' done':''}${dueClass}" id="card-${o.id}" style="${cardBg}">
    <div class="order-top-row">
      <div class="order-num">#${num}</div>
      <div class="order-time">${orderTimeStr}<br><span style="font-size:10px;color:#bbb;">접수</span></div>
      <div class="drink-icons">${drinkIconsHtml}</div>
      <div class="order-info">
        <div class="order-name" style="${strike}">${o.name || '이름없음'} ${isDone?'<span style=\"color:#1a7a4a;font-size:11px;\">[완료]</span>':''}</div>
        ${o.location ? `<div class="order-meta" style="${strike}" title="${esc(meta)}">📍 ${esc(o.location)}</div>` : ''}
        <div class="item-lines" title="${esc(meta)}">${itemLinesHtml || '<span class="order-meta">정보 없음</span>'}</div>
        <div class="order-meta">
          ${delivLabel ? `<span class="delivery-tag">${delivLabel}</span>` : ''}
          ${o.deliveryTime ? `<b style="color:#1a7a4a;">${o.deliveryTime}</b>` : ''}${dueTag}
          ${o.extraRequest ? ` · 📝 ${o.extraRequest}` : ''}
        </div>
        <div class="order-price" style="${strike}">${fmtPrice(o.totalPrice)}</div>
      </div>
      <button class="check-btn${isDone?' checked':''}" data-order-id="${o.id}" onclick="toggleCheck(this.getAttribute('data-order-id'))" title="${isDone?'완료 취소':'완료 처리'}">✓</button>
    </div>
  </div>`;
}

// ─── Firebase 연결 ────────────────────────────────────────────
const badge = document.getElementById('conn-badge');

try {
  const app = firebase.initializeApp(firebaseConfig);
  db = firebase.firestore(app);

  badge.textContent = '연결 중...';
  loadDrinkIcons(); // 음료별 아이콘(이모지/이미지) 미리 로드

  db.collection('orders')
    .orderBy('orderTime', 'desc')
    .onSnapshot(snap => {
      badge.textContent   = '🟢 실시간 연결';
      badge.className     = 'badge badge-live';

      // 신규 주문 감지
      const newIds = new Set(snap.docs.map(d => d.id));
      let hasNew = false;
      snap.docs.forEach(d => { if (!prevOrderIds.has(d.id) && prevOrderIds.size > 0) hasNew = true; });
      if (hasNew) {
        playNewOrderSound();
        // 새 주문 카드 강조
        snap.docs.forEach(d => {
          if (!prevOrderIds.has(d.id)) {
            setTimeout(() => {
              const el = document.getElementById('card-' + d.id);
              if (el) { el.classList.add('new-pulse'); setTimeout(() => el.classList.remove('new-pulse'), 1000); }
            }, 300);
          }
        });
      }
      prevOrderIds = newIds;

      allOrders = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      buildDateTabs();
      renderOrders();
    }, err => {
      badge.textContent = '❌ 오류: ' + err.code;
      badge.className   = 'badge badge-off';
      document.getElementById('order-list').innerHTML =
        `<div class="empty">❌ 오류: ${err.message}<br><small>Firestore 규칙 또는 인터넷 연결을 확인하세요</small></div>`;
    });

} catch(e) {
  badge.textContent = '❌ 초기화 실패';
  document.getElementById('order-list').innerHTML =
    `<div class="empty">❌ Firebase 초기화 오류<br><small>${e.message}</small></div>`;
}
</script>
</body>
